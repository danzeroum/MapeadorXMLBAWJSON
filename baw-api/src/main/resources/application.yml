spring:
  application:
    name: process-veritas-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/processveritas}
    username: ${DB_USER:processveritas}
    password: ${DB_PASSWORD:processveritas}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          secret: ${JWT_SECRET:change-me-in-production-min-32-chars-ok}

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

pv:
  analysis:
    work-dir: ${PV_WORK_DIR:/tmp/pv-runs}
    cleanup-on-finish: true
  jwt:
    access-token-expiry: 900      # 15 minutes
    refresh-token-expiry: 604800  # 7 days
  rate-limit:
    runs-per-hour: 10
